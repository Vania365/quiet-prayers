# Pray with Me: cloud builds on Codemagic (https://codemagic.io)
# The web app lives in ./www (copied from ../quiet_prayers_app with `npm run web` before each commit).
#
# Workflows:
#   android-test    -> debug APK you can install on any Android phone to try the app
#   android-release -> signed .aab for Google Play (needs the "quiet_prayers_keystore" signing
#                      identity in Codemagic: Teams > Code signing identities > Android keystores)
#   ios-release     -> App Store build (only after buying Apple Developer; needs App Store Connect
#                      API key in Codemagic: Teams > Code signing identities > iOS)

workflows:
  android-test:
    name: Android test APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Sync Capacitor (www -> android)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android release (Google Play .aab)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      android_signing:
        - quiet_prayers_keystore
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.quietprayers.daily"
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Sync Capacitor (www -> android)
        script: npx cap sync android
      - name: Build signed bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    # Optional later: automatic upload to Play Console internal testing
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal

  make-keystore:
    name: Make signing keystore (run once, then upload it under Code signing identities)
    instance_type: mac_mini_m2
    max_build_duration: 10
    environment:
      java: 21
    scripts:
      - name: Generate keystore + password file
        script: |
          PW=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-20)
          keytool -genkeypair -v -keystore pray_with_me.jks -storetype JKS -alias praywithme             -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW"             -dname "CN=Pray with Me, O=Pray with Me, C=IL"
          printf 'Pray with Me - Android signing key (KEEP SAFE, never share)
keystore file: pray_with_me.jks
key alias: praywithme
keystore password: %s
key password: %s
Codemagic reference name: quiet_prayers_keystore
' "$PW" "$PW" > pray_with_me_keystore_PASSWORD.txt
          keytool -list -v -keystore pray_with_me.jks -storepass "$PW" | grep -E "Alias|Valid|SHA256" || true
    artifacts:
      - pray_with_me.jks
      - pray_with_me_keystore_PASSWORD.txt

  ios-release:
    name: iOS App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: quiet_prayers_asc   # name of the App Store Connect API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.quietprayers.daily
      node: 22
      xcode: latest
    scripts:
      - name: Install npm packages
        script: npm ci
      - name: Sync Capacitor (www -> ios)
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
